language: python
dist: jammy
python:
  - "3.12"

env:
  global:
    # Throwaway key used only for running tests in CI; the real key is set on EB.
    - DJANGO_SECRET_KEY=travis-ci-insecure-test-key

before_install:
  - cd ebdjango

install:
  - pip install -r requirements.txt -r requirements-dev.txt

script:
  - black --check .
  - flake8 .
  - coverage run manage.py test

after_success:
  - coveralls

deploy:
  provider: elasticbeanstalk
  edge: true
  access_key_id: $AWS_ACCESS_KEY_ID
  secret_access_key: $AWS_SECRET_ACCESS_KEY
  region: us-east-2
  app: $EB_APP
  env: $EB_ENV
  bucket: $EB_BUCKET
  on:
    branch: main
